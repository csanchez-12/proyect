name: Build and deploy addicompleto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "frontend=ghcr.io/$OWNER/addicompleto-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/$OWNER/addicompleto-backend" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_1: ${{ secrets.DO_KNOWN_HOSTS }}
          SSH_KNOWN_HOSTS_2: ${{ secrets.DO_KNOWN_HOSTS_2 }}
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n%s\n' \
            "$SSH_KNOWN_HOSTS_1" \
            "$SSH_KNOWN_HOSTS_2" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to both Droplets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_HOST_2: ${{ secrets.DO_HOST_2 }}
          DO_USER: ${{ secrets.DO_USER }}
        shell: bash
        run: |
          set -euo pipefail

          HOSTS=("$DO_HOST" "$DO_HOST_2")
          DOMAINS=("aliadosaddi.shop" "addifinanzas.info")
          NGINX_FILES=(
            "frontend/nginx.aliados.conf"
            "frontend/nginx.addifinanzas.conf"
          )

          for i in 0 1; do
            HOST="${HOSTS[$i]}"
            DOMAIN="${DOMAINS[$i]}"
            NGINX_FILE="${NGINX_FILES[$i]}"

            echo "Deploying $DOMAIN to $HOST..."

            # Preparar el servidor y corregir DOMAIN.
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$DO_USER@$HOST" bash -s -- "$DOMAIN" <<'REMOTE'
          set -euo pipefail

          DOMAIN="$1"
          cd /opt/addicompleto

          test -f .env || {
            echo "ERROR: Falta /opt/addicompleto/.env"
            exit 1
          }

          if grep -q '^DOMAIN=' .env; then
            sed -i "s|^DOMAIN=.*|DOMAIN=$DOMAIN|" .env
          else
            printf '\nDOMAIN=%s\n' "$DOMAIN" >> .env
          fi

          # Eliminar solamente el directorio incorrecto si está vacío.
          if [ -d nginx.conf ]; then
            rmdir nginx.conf || {
              echo "ERROR: nginx.conf es un directorio no vacío. No se borró."
              exit 1
            }
          fi
          REMOTE

            # Copiar Compose.
            scp -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              compose.production.yaml \
              "$DO_USER@$HOST:/opt/addicompleto/compose.production.yaml"

            # Copiar la configuración Nginx específica.
            scp -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              "$NGINX_FILE" \
              "$DO_USER@$HOST:/opt/addicompleto/nginx.conf"

            # Validar y desplegar.
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$DO_USER@$HOST" '
                set -euo pipefail
                cd /opt/addicompleto

                test -f nginx.conf || {
                  echo "ERROR: nginx.conf no existe o no es un archivo"
                  exit 1
                }

                docker compose --env-file .env -f compose.production.yaml config >/dev/null

                docker compose --env-file .env -f compose.production.yaml pull

                docker compose --env-file .env -f compose.production.yaml up -d --remove-orphans

                docker exec addicompleto-frontend-1 nginx -t
                docker exec addicompleto-frontend-1 nginx -s reload

                docker image prune -f
              '

            echo "Deployment completed: $DOMAIN"
          done