name: Build and deploy addicompleto

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "frontend=ghcr.io/${OWNER}/addicompleto-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${OWNER}/addicompleto-backend" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy to all Droplets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
          KNOWN_HOSTS_2: ${{ secrets.DO_KNOWN_HOSTS_2 }}
          KNOWN_HOSTS_3: ${{ secrets.DO_KNOWN_HOSTS_3 }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS_2" >> ~/.ssh/known_hosts
          printf '%s\n' "$KNOWN_HOSTS_3" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'SSH'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ServerAliveCountMax 5
          SSH

      - name: Deploy to both servers
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_HOST_2: ${{ secrets.DO_HOST_2 }}
          DO_HOST_3: ${{ secrets.DO_HOST_3 }}
          DO_USER: ${{ secrets.DO_USER }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          DO_ENV: ${{ secrets.DO_ENV }}
          DO_ENV_2: ${{ secrets.DO_ENV_2 }}
          DO_ENV_3: ${{ secrets.DO_ENV_3 }}
        run: |
          set -euo pipefail

          test -n "$DO_HOST"
          test -n "$DO_USER"
          test -n "$LETSENCRYPT_EMAIL"

          HOSTS=("$DO_HOST" "$DO_HOST_2" "$DO_HOST_3")
          ENVS=("$DO_ENV" "$DO_ENV_2" "$DO_ENV_3")
          DOMAINS=("preaprovalaliefectivo.online" "preapprovalmarketaddi.shop")
          NGINX_TEMPLATE="frontend/nginx.conf.template"

          for i in 0 1 2; do
            HOST="${HOSTS[$i]}"
            [ -n "$HOST" ] || continue
            DOMAIN="${DOMAINS[$i]:-${DOMAINS[0]}}"

            echo "========================================"
            echo "Deploying ${DOMAIN} to ${HOST}"
            echo "========================================"

            test -f "$NGINX_TEMPLATE"
            test -f "compose.production.yaml"

            # Seleccionar el contenido de .env correspondiente al droplet.
            ENV_CONTENT="${ENVS[$i]}"

            # Asegurar que exista el directorio remoto antes de copiar.
            ssh "${DO_USER}@${HOST}" "mkdir -p /opt/addicompleto"

            # Copiar archivos sin modificar el .env del servidor.
            scp compose.production.yaml \
              "${DO_USER}@${HOST}:/opt/addicompleto/compose.production.yaml"

            scp "$NGINX_TEMPLATE" \
              "${DO_USER}@${HOST}:/opt/addicompleto/nginx.conf.template"

            # Copiar .env entrante solo si se proporcionó.
            if [ -n "$ENV_CONTENT" ]; then
              printf '%s\n' "$ENV_CONTENT" > .env.incoming
              scp .env.incoming \
                "${DO_USER}@${HOST}:/opt/addicompleto/.env.incoming"
              rm -f .env.incoming
            fi

            # Ejecutar despliegue remoto.
            ssh "${DO_USER}@${HOST}" \
              "DOMAIN='${DOMAIN}' EMAIL='${LETSENCRYPT_EMAIL}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/addicompleto

          # Evitar que nginx.conf sea un directorio residual de mounts fallidos.
          rm -rf nginx.conf
          touch nginx.conf

          echo "Checking server configuration..."

          # Abrir puertos en UFW.
          if command -v ufw >/dev/null 2>&1; then
            ufw allow 22/tcp || true
            ufw allow 80/tcp || true
            ufw allow 443/tcp || true
            ufw --force enable || true
          fi

          # Usar .env entrante si se proporcionó y no existe .env.
          if [ ! -f .env ] && [ -f .env.incoming ]; then
            mv .env.incoming .env
            echo ".env creado desde secret por droplet."
          elif [ -f .env.incoming ]; then
            rm -f .env.incoming
          fi

          if [ ! -f .env ]; then
            echo "Creating fallback /opt/addicompleto/.env..."
            cat > .env <<ENV
          BOT_TOKEN=a
          CHAT_ID=a
          BOT_NAME=a
          DIDIT_KEY=a
          DOMAIN=${DOMAIN}
          ENV
          fi

          # Normalizar .env (sin espacios alrededor de =) para docker compose.
          sed -i -E 's/^[[:space:]]*([A-Za-z_]+)[[:space:]]*=[[:space:]]*/\1=/' .env

          if [ ! -s nginx.conf.template ]; then
            echo "ERROR: nginx.conf.template no existe o está vacío"
            exit 1
          fi

          # Generar configuración final a partir de la plantilla.
          sed "s/__DOMAIN__/${DOMAIN}/g" nginx.conf.template > nginx.final.conf

          if [ ! -s nginx.final.conf ]; then
            echo "ERROR: nginx.final.conf no existe o está vacío"
            exit 1
          fi

          # Abrir HTTP y HTTPS en UFW si está activo.
          if command -v ufw >/dev/null 2>&1 && ufw status | grep -q "Status: active"; then
            ufw allow 80/tcp
            ufw allow 443/tcp
          fi

          # Actualizar DOMAIN sin sobrescribir el resto del .env.
          if grep -qE '^DOMAIN[[:space:]]*=' .env; then
            sed -i -E "s|^DOMAIN[[:space:]]*=.*|DOMAIN=${DOMAIN}|" .env
          else
            echo "DOMAIN=${DOMAIN}" >> .env
          fi

          # Validar configuración de Docker Compose.
          docker compose --env-file .env -f compose.production.yaml config -q

          echo "Pulling Docker images..."
          docker compose --env-file .env -f compose.production.yaml pull

          CERT_DIR="/etc/letsencrypt/live/${DOMAIN}"

          # Comprobar que existe un certificado válido por al menos 30 días.
          CERT_VALID=0

          if docker compose --env-file .env -f compose.production.yaml run --rm \
            --entrypoint sh certbot -c \
            "test -s '${CERT_DIR}/fullchain.pem' &&
             test -s '${CERT_DIR}/privkey.pem' &&
             openssl x509 -checkend 2592000 -noout -in '${CERT_DIR}/fullchain.pem'" \
            >/dev/null 2>&1; then
            CERT_VALID=1
          fi

          echo "Certificate valid: ${CERT_VALID}"

          if [ "$CERT_VALID" -eq 1 ]; then
            echo "Using existing HTTPS configuration..."
            cp nginx.conf nginx.conf.previous 2>/dev/null || true
            cp nginx.final.conf nginx.conf
          else
            echo "No valid certificate. Starting temporary HTTP configuration..."

            # Esta configuración sirve la aplicación por HTTP y permite
            # que Let's Encrypt valide el dominio mediante webroot.
            cat > nginx.conf <<'NGINX'
          server {
              listen 80;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/certbot;
                  default_type text/plain;
                  try_files $uri =404;
              }

              location = /health {
                  access_log off;
                  default_type text/plain;
                  return 200 "OK";
              }

              location /api/news/events/ {
                  proxy_pass http://backend:3000/news/events/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_buffering off;
                  proxy_cache off;
                  proxy_read_timeout 3600s;
              }

              location /api/ {
                  proxy_pass http://backend:3000/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX
          fi

          echo "Starting backend..."
          docker compose --env-file .env -f compose.production.yaml up -d backend

          # Esperar a que el backend responda (Nginx resuelve el upstream al arrancar).
          for attempt in $(seq 1 30); do
            if docker compose --env-file .env -f compose.production.yaml exec -T backend wget -qO- http://localhost:3000/health >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for backend... attempt ${attempt}/30"
            sleep 2
          done

          echo "Starting frontend..."
          docker compose --env-file .env -f compose.production.yaml up -d frontend

          echo "Waiting for HTTP health endpoint..."

          HEALTH_OK=0

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/health >/dev/null 2>&1; then
              HEALTH_OK=1
              break
            fi

            echo "Waiting for frontend... attempt ${attempt}/30"
            sleep 5
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "ERROR: Frontend health check failed"
            docker compose --env-file .env -f compose.production.yaml ps
            docker compose --env-file .env -f compose.production.yaml logs --tail=80 frontend backend
            exit 1
          fi

          echo "HTTP health check passed."

          # Solicitar o renovar el certificado si no hay uno válido.
          if [ "$CERT_VALID" -ne 1 ]; then
            echo "Requesting Let's Encrypt certificate..."

            CERT_OK=0

            for attempt in 1 2 3; do
              echo "Certbot attempt ${attempt}/3"

              if docker compose --env-file .env -f compose.production.yaml run --rm certbot \
                certonly \
                --webroot \
                --webroot-path /var/www/certbot \
                --cert-name "$DOMAIN" \
                -d "$DOMAIN" \
                -d "www.$DOMAIN" \
                --email "$EMAIL" \
                --non-interactive \
                --agree-tos \
                --keep-until-expiring; then
                CERT_OK=1
                break
              fi

              sleep 10
            done

            if [ "$CERT_OK" -ne 1 ]; then
              echo "WARNING: Certbot failed. The site remains available over HTTP."
            fi
          fi

          # Verificar nuevamente el certificado antes de activar HTTPS.
          CERT_VALID=0

          if docker compose --env-file .env -f compose.production.yaml run --rm \
            --entrypoint sh certbot -c \
            "test -s '${CERT_DIR}/fullchain.pem' &&
             test -s '${CERT_DIR}/privkey.pem' &&
             openssl x509 -checkend 2592000 -noout -in '${CERT_DIR}/fullchain.pem'" \
            >/dev/null 2>&1; then
            CERT_VALID=1
          fi

          if [ "$CERT_VALID" -eq 1 ]; then
            echo "Activating HTTPS configuration..."

            # Guardar la configuración actual antes de cambiarla.
            cp nginx.conf nginx.conf.previous

            cp nginx.final.conf nginx.conf

            # Validar antes de recargar Nginx.
            if ! docker compose --env-file .env -f compose.production.yaml exec -T frontend nginx -t; then
              echo "ERROR: Invalid Nginx configuration. Rolling back..."
              cp nginx.conf.previous nginx.conf
              exit 1
            fi

            if ! docker compose --env-file .env -f compose.production.yaml exec -T frontend nginx -s reload; then
              echo "ERROR: Nginx reload failed. Rolling back..."
              cp nginx.conf.previous nginx.conf
              docker compose --env-file .env -f compose.production.yaml exec -T frontend nginx -s reload || true
              exit 1
            fi

            echo "HTTPS configuration activated."

            # Verificar respuesta HTTPS local.
            if ! curl -kfsS --resolve "${DOMAIN}:443:127.0.0.1" \
              "https://${DOMAIN}/" >/dev/null; then
              echo "WARNING: Local HTTPS check failed."
            else
              echo "HTTPS check passed."
            fi
          else
            echo "WARNING: No valid certificate. Keeping HTTP configuration."
          fi

          echo "Final container status:"
          docker compose --env-file .env -f compose.production.yaml ps

          # Limpiar imágenes antiguas sin afectar volúmenes.
          docker image prune -f

          echo "Deployment completed for ${DOMAIN}."
          REMOTE

            echo "Deployment finished for ${DOMAIN}"
          done

          echo "All deployments completed."
