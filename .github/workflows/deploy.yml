name: Build and deploy addicompleto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "frontend=ghcr.io/$OWNER/addicompleto-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/$OWNER/addicompleto-backend" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_1: ${{ secrets.DO_KNOWN_HOSTS }}
          SSH_KNOWN_HOSTS_2: ${{ secrets.DO_KNOWN_HOSTS_2 }}
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n%s\n' \
            "$SSH_KNOWN_HOSTS_1" \
            "$SSH_KNOWN_HOSTS_2" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to both Droplets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_HOST_2: ${{ secrets.DO_HOST_2 }}
          DO_USER: ${{ secrets.DO_USER }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DO_HOST" || {
            echo "ERROR: Falta DO_HOST"
            exit 1
          }

          test -n "$DO_HOST_2" || {
            echo "ERROR: Falta DO_HOST_2"
            exit 1
          }

          test -n "$DO_USER" || {
            echo "ERROR: Falta DO_USER"
            exit 1
          }

          test -n "$LETSENCRYPT_EMAIL" || {
            echo "ERROR: Falta el secreto LETSENCRYPT_EMAIL"
            exit 1
          }

          HOSTS=("$DO_HOST" "$DO_HOST_2")
          DOMAINS=("aliadosaddi.site" "addifinanzas.info")
          NGINX_FILES=(
            "frontend/nginx.aliados.conf"
            "frontend/nginx.addifinanzas.conf"
          )

          for i in 0 1; do
            HOST="${HOSTS[$i]}"
            DOMAIN="${DOMAINS[$i]}"
            NGINX_FILE="${NGINX_FILES[$i]}"

            echo "========================================"
            echo "Deploying $DOMAIN to $HOST"
            echo "========================================"

            # Copiar Compose.
            scp -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              compose.production.yaml \
              "$DO_USER@$HOST:/opt/addicompleto/compose.production.yaml"

            # Copiar configuración Nginx definitiva.
            scp -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              "$NGINX_FILE" \
              "$DO_USER@$HOST:/opt/addicompleto/nginx.final.conf"

            # Desplegar en el servidor.
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$DO_USER@$HOST" bash -s -- "$DOMAIN" "$LETSENCRYPT_EMAIL" <<'REMOTE'
          set -euo pipefail

          DOMAIN="$1"
          EMAIL="$2"

          cd /opt/addicompleto

          echo "Preparing deployment for $DOMAIN"

          test -f .env || {
            echo "ERROR: Falta /opt/addicompleto/.env"
            exit 1
          }

          test -f nginx.final.conf || {
            echo "ERROR: Falta nginx.final.conf"
            exit 1
          }

          # Actualizar DOMAIN en .env.
          if grep -q '^DOMAIN=' .env; then
            sed -i "s|^DOMAIN=.*|DOMAIN=$DOMAIN|" .env
          else
            printf '\nDOMAIN=%s\n' "$DOMAIN" >> .env
          fi

          # Validar Compose.
          docker compose --env-file .env -f compose.production.yaml config >/dev/null

          # Descargar imágenes.
          docker compose --env-file .env -f compose.production.yaml pull

          # Preparar configuración HTTP temporal.
          # Esta configuración NO necesita certificados SSL.

          if [ -d nginx.conf ]; then
            rmdir nginx.conf || {
              echo "ERROR: nginx.conf es un directorio no vacío"
              exit 1
            }
          fi

          cat > nginx.conf <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;

              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/certbot;
                  default_type text/plain;
                  try_files $uri =404;
              }

              location = /health {
                  access_log off;
                  default_type text/plain;
                  return 200 "healthy";
              }

              location / {
                  return 200 "ACME validation ready";
              }
          }
          NGINX

          # Levantar backend.
          docker compose --env-file .env -f compose.production.yaml up -d backend

          # Levantar frontend con HTTP.
          docker compose --env-file .env -f compose.production.yaml up -d --force-recreate frontend

          # Esperar a que Nginx esté disponible.
          READY=0

          for attempt in $(seq 1 20); do
            if docker compose --env-file .env -f compose.production.yaml exec -T frontend \
              wget -q -O- http://127.0.0.1/health >/dev/null 2>&1; then
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Nginx temporal no respondió por HTTP"
            docker compose --env-file .env -f compose.production.yaml logs --tail 50 frontend
            exit 1
          fi

          echo "HTTP is working. Preparing SSL certificate."

          # Comprobar si ya existe un certificado válido.
          CERT_DIR="/etc/letsencrypt/live/$DOMAIN"

          CERT_EXISTS=0

          if docker compose --env-file .env -f compose.production.yaml run --rm --no-deps \
            --entrypoint sh certbot -c \
            "test -s '$CERT_DIR/fullchain.pem' && test -s '$CERT_DIR/privkey.pem'"; then
            CERT_EXISTS=1
            echo "Existing certificate found for $DOMAIN"
          fi

          # Emitir o renovar el certificado.
          # Si falla, el servidor conserva HTTP temporal.
          if ! docker compose --env-file .env -f compose.production.yaml run --rm certbot \
            certonly \
            --webroot \
            --webroot-path /var/www/certbot \
            --cert-name "$DOMAIN" \
            -d "$DOMAIN" \
            -d "www.$DOMAIN" \
            --email "$EMAIL" \
            --non-interactive \
            --agree-tos \
            --keep-until-expiring; then

            echo "ERROR: Certbot failed for $DOMAIN"
            echo "HTTP remains available, HTTPS was not activated."
            exit 1
          fi

          # Verificar los archivos del certificado.
          if ! docker compose --env-file .env -f compose.production.yaml run --rm --no-deps \
            --entrypoint sh certbot -c \
            "test -s '$CERT_DIR/fullchain.pem' && test -s '$CERT_DIR/privkey.pem'"; then

            echo "ERROR: SSL certificate files are missing or empty."
            exit 1
          fi

          echo "SSL certificate verified for $DOMAIN"

          # Activar configuración Nginx definitiva.
          cat nginx.final.conf > nginx.conf

          # Validar la configuración antes de recargar.
          if ! docker compose --env-file .env -f compose.production.yaml exec -T frontend nginx -t; then
            echo "ERROR: Nginx configuration validation failed."

            # Restaurar HTTP temporal para evitar dejar Nginx sin arrancar.
            cat > nginx.conf <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;

              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/certbot;
                  default_type text/plain;
                  try_files $uri =404;
              }

              location / {
                  return 200 "ACME validation ready";
              }
          }
          NGINX

            exit 1
          fi

          # Aplicar HTTPS.
          docker compose --env-file .env -f compose.production.yaml exec -T frontend nginx -s reload

          # Eliminar contenedor Certbot antiguo, si existe.
          docker compose --env-file .env -f compose.production.yaml rm -f certbot || true

          # Limpiar imágenes no utilizadas.
          docker image prune -f

          echo "Deployment completed successfully: $DOMAIN"
          REMOTE

            echo "Deployment completed: $DOMAIN"
          done

          echo "========================================"
          echo "ALL DEPLOYMENTS COMPLETED"
          echo "========================================"
