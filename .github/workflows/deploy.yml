name: Build and deploy addicompleto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "frontend=ghcr.io/$OWNER/addicompleto-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/$OWNER/addicompleto-backend" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS_1: ${{ secrets.DO_KNOWN_HOSTS }}
          SSH_KNOWN_HOSTS_2: ${{ secrets.DO_KNOWN_HOSTS_2 }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n%s\n' \
            "$SSH_KNOWN_HOSTS_1" \
            "$SSH_KNOWN_HOSTS_2" > ~/.ssh/known_hosts

      - name: Deploy to both Droplets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_HOST_2: ${{ secrets.DO_HOST_2 }}
          DO_USER: ${{ secrets.DO_USER }}

          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_NAME: ${{ secrets.BOT_NAME }}
          DIDIT_KEY: ${{ secrets.DIDIT_KEY }}

        shell: bash
        run: |
          set -euo pipefail

          for HOST in "$DO_HOST" "$DO_HOST_2"; do
            echo "Deploying to $HOST..."

            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$DO_USER@$HOST" \
              'mkdir -p /opt/addicompleto'

            scp -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              compose.production.yaml \
              "$DO_USER@$HOST:/opt/addicompleto/compose.production.yaml"

            printf '%s\n' \
              "BOT_TOKEN=$BOT_TOKEN" \
              "CHAT_ID=$CHAT_ID" \
              "BOT_NAME=$BOT_NAME" \
              "DIDIT_KEY=$DIDIT_KEY" |
              ssh -i ~/.ssh/deploy_key \
                -o IdentitiesOnly=yes \
                -o BatchMode=yes \
                "$DO_USER@$HOST" \
                'umask 077; cat > /opt/addicompleto/.env'

            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$DO_USER@$HOST" '
                set -e
                cd /opt/addicompleto
                docker compose --env-file .env -f compose.production.yaml pull
                docker compose --env-file .env -f compose.production.yaml up -d --remove-orphans
                docker image prune -f
              '

            echo "Deployment completed on $HOST"
          done