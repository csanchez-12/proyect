
# Rechazar dominios desconocidos por HTTP
server {
    listen 80 default_server;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy";
    }

    return 444;
}

# HTTP: permitir ACME y redirigir el resto a HTTPS
server {
    listen 80;
    server_name aliadosaddi.shop www.aliadosaddi.shop;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Rechazar conexiones HTTPS con dominios desconocidos
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}

# Aplicación HTTPS
server {
    listen 443 ssl;
    server_name aliadosaddi.shop www.aliadosaddi.shop;

    ssl_certificate /etc/letsencrypt/live/aliadosaddi.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliadosaddi.shop/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml
        font/woff2;

    location /api/ {
    proxy_pass http://backend:3000/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    }

    # Healthcheck
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy";
    }

    # Archivos estáticos
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML sin caché
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router / SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
