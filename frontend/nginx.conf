
# Rechazar solicitudes HTTP de dominios desconocidos
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Aplicación principal
server {
    listen 80;
    server_name aliadosaddi.shop www.aliadosaddi.shop;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml
        font/woff2;

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de archivos estáticos de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Evitar cache del HTML principal
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Healthcheck
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy";
    }
}
