server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css application/json application/javascript text/xml text/javascript font application/font-woff2;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }
}